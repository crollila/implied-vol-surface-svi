name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: pytest (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The suite is fully offline: every fixture is a synthetic options
      # chain generated from a known SVI surface, so nothing here touches
      # the network or depends on market hours.
      - name: Run tests
        run: pytest -q

      - name: Reproduce the committed SPY analysis from cache
        run: python -m volsurface --ticker SPY --rate 0.04 --offline -q
