[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "volsurface"
version = "0.1.0"
description = "Implied volatility surface construction and SVI calibration from live equity-index options data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Implied Vol Surface project" }]
keywords = ["quantitative-finance", "options", "implied-volatility", "SVI", "black-scholes"]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "yfinance>=0.2.40",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
volsurface = "volsurface.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
